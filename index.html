<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude shimeji: Клауд питомец</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23ff6a13'/%3E%3Crect x='3' y='3' width='10' height='9' fill='%232b1208'/%3E%3Crect x='5' y='6' width='2' height='2' fill='%23fff1de'/%3E%3Crect x='9' y='6' width='2' height='2' fill='%23fff1de'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@500;800;900&display=swap" rel="stylesheet">
<style>
:root{--o1:#ff9a2e;--o2:#ff6a13;--o3:#e8500a;--ink:#2b1208;--cream:#fff1de;--green:#173326;
--pix:"Press Start 2P","Courier New",monospace;--ui:"Rubik","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html{background:#ff6a13;-webkit-text-size-adjust:100%}html,body{margin:0;min-height:100%}button,.photo,.dl{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{font-family:var(--ui);color:var(--ink);background:linear-gradient(160deg,var(--o1),var(--o2) 55%,var(--o3));background-attachment:fixed;overflow-x:hidden}
/* мягкие движущиеся пятна света и пиксельная сетка */
body::before{content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;
background:radial-gradient(40% 40% at 20% 25%,rgba(255,220,150,.55),transparent 70%),radial-gradient(35% 35% at 80% 70%,rgba(255,120,40,.6),transparent 70%);animation:drift 18s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
background-image:radial-gradient(rgba(43,18,8,.14) 1.5px,transparent 1.6px);background-size:22px 22px}
@keyframes drift{to{transform:translate(6%,-5%) rotate(8deg) scale(1.08)}}
a,button{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}

header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px clamp(18px,5vw,56px)}
.logo{font-family:var(--pix);font-size:clamp(13px,2.6vw,20px);line-height:1.4;color:var(--cream);text-decoration:none;
text-shadow:2px 2px 0 var(--ink),4px 4px 0 var(--ink);letter-spacing:.04em;white-space:nowrap}
.logo i{display:inline-block;width:.6em;height:1em;background:var(--cream);margin-left:.25em;vertical-align:-.12em;box-shadow:2px 2px 0 var(--ink);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
nav{display:flex;gap:10px}
nav button{cursor:pointer;border:3px solid var(--ink);background:transparent;border-radius:999px;padding:9px 22px;font-weight:800;font-size:16px;transition:transform .15s,background .15s,color .15s}
nav button:hover{transform:translateY(-2px);background:var(--cream)}
nav button[aria-selected="true"]{background:var(--ink);color:var(--cream)}

main{padding:0 clamp(18px,5vw,56px) 64px}
[hidden]{display:none!important}

/* ГЛАВНАЯ */
.home{display:grid;grid-template-columns:1.2fr .8fr;gap:clamp(28px,5vw,72px);align-items:center;min-height:calc(100vh - 110px)}
h1{margin:0;font-weight:900;font-size:clamp(44px,8.4vw,112px);line-height:.98;letter-spacing:-.02em}
h1 .line{display:block}
h1 .line+.line{color:var(--cream);text-shadow:3px 3px 0 var(--ink),6px 6px 0 var(--ink)}
.w{display:inline-block;margin-right:.18em;animation:pop .8s cubic-bezier(.2,1.7,.4,1) both;animation-delay:calc(var(--i)*.1s + .1s);transition:transform .2s}
.w:hover{transform:translateY(-8px) rotate(-4deg)}
@keyframes pop{from{opacity:0;transform:translateY(60px) rotate(-8deg) scale(.6)}}
.lead{max-width:34em;margin:26px 0 30px;font-size:clamp(16px,2vw,20px);font-weight:500;line-height:1.55}
.cta{display:inline-flex;align-items:center;gap:12px;cursor:pointer;position:relative;overflow:hidden;border:0;background:var(--ink);color:var(--cream);
border-radius:20px;padding:18px 30px;font-weight:800;font-size:clamp(17px,2.4vw,22px);box-shadow:6px 6px 0 var(--cream),6px 6px 0 3px var(--ink);
transition:transform .15s,box-shadow .15s;animation:nudge 3.6s ease-in-out 2s infinite}
.cta svg{width:1.2em;height:1.2em;flex:none}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,154,46,.55) 50%,transparent 65%);transform:translateX(-120%)}
.cta:hover{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--cream),2px 2px 0 3px var(--ink);animation:none}
.cta:hover::after{transform:translateX(120%);transition:transform .7s}
@keyframes nudge{0%,88%,100%{transform:none}92%{transform:translateY(-7px)}96%{transform:translateY(0)}}

.photo{position:relative;justify-self:center;width:100%;max-width:420px;aspect-ratio:4/5;border:4px solid var(--ink);border-radius:26px;overflow:hidden;background:var(--green);
box-shadow:10px 10px 0 var(--ink);transform:rotate(2.5deg);transition:transform .35s cubic-bezier(.2,1.4,.4,1);cursor:pointer;animation:pop .9s cubic-bezier(.2,1.5,.4,1) .7s both}
.photo img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.photo .a{object-fit:cover;transition:transform .5s}
.photo .b{object-fit:contain;background:var(--green);clip-path:inset(0 0 100% 0);transition:clip-path .55s cubic-bezier(.7,0,.2,1)}
.photo.show{transform:rotate(-1.5deg) translateY(-6px)}
.photo.show .a{transform:scale(1.08)}
.photo.show .b{clip-path:inset(0)}
.tag{position:absolute;left:12px;bottom:12px;z-index:2;background:var(--ink);color:var(--cream);font-weight:800;font-size:14px;padding:7px 14px;border-radius:999px}
.tag .t2,.photo.show .t1{display:none}
.photo.show .t2{display:inline}
@media (hover:hover){
 .photo:hover{transform:rotate(-1.5deg) translateY(-6px)}
 .photo:hover .a{transform:scale(1.08)}
 .photo:hover .b{clip-path:inset(0)}
 .photo:hover .t1{display:none}
 .photo:hover .t2{display:inline}
}
@media (hover:none){.photo:not(.show) .tag{display:none}}

/* СКАЧАТЬ */
.dl-wrap{max-width:860px;margin:0 auto;padding-top:clamp(20px,6vh,70px)}
h2{margin:0 0 28px;font-weight:900;font-size:clamp(44px,8vw,96px);line-height:1;color:var(--cream);text-shadow:3px 3px 0 var(--ink),6px 6px 0 var(--ink)}
.card{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:var(--cream);border:4px solid var(--ink);border-radius:26px;padding:clamp(18px,3vw,30px);box-shadow:10px 10px 0 var(--ink)}
.card b{display:block;font-weight:900;font-size:clamp(22px,3.4vw,34px);line-height:1.15}
.card small{display:block;margin-top:6px;font-weight:500;font-size:15px;opacity:.75}
.dl{display:inline-flex;align-items:center;gap:10px;text-decoration:none;background:var(--o2);border:4px solid var(--ink);border-radius:18px;padding:14px 30px;font-weight:900;font-size:22px;box-shadow:5px 5px 0 var(--ink);transition:transform .15s,box-shadow .15s,background .15s}
.dl:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink);background:var(--o1)}
.dl svg{width:1.1em;height:1.1em}

@media (max-width:820px){
 body{background-attachment:scroll}
 header{flex-direction:column;align-items:flex-start;gap:14px;padding:max(16px,env(safe-area-inset-top)) 18px 10px}
 .logo{font-size:15px}
 nav{width:100%}
 nav button{flex:1;min-height:46px;padding:10px 0;font-size:17px}
 main{padding:0 18px max(48px,env(safe-area-inset-bottom))}
 .home{grid-template-columns:1fr;min-height:0;gap:34px;padding-top:14px}
 h1{font-size:clamp(38px,12.2vw,64px);line-height:1.02}
 h1 .line+.line{text-shadow:2px 2px 0 var(--ink),4px 4px 0 var(--ink)}
 .lead{margin:18px 0 26px;font-size:16px}
 .cta{width:100%;justify-content:center;padding:18px 20px;font-size:19px;box-shadow:5px 5px 0 var(--cream),5px 5px 0 3px var(--ink)}
 .photo{max-width:320px;box-shadow:7px 7px 0 var(--ink);margin-bottom:10px}
 h2{font-size:clamp(40px,13vw,64px);text-shadow:2px 2px 0 var(--ink),4px 4px 0 var(--ink);margin-bottom:22px}
 .dl-wrap{padding-top:18px}
 .card{flex-direction:column;align-items:stretch;gap:18px;box-shadow:7px 7px 0 var(--ink)}
 .dl{justify-content:center;padding:16px 20px}
}
@media (max-width:360px){h1{font-size:36px}.logo{font-size:13px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== ОБНОВЛЁННЫЕ АНИМАЦИИ ===== */
header,main{position:relative;z-index:1}
.sparks{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sparks i{position:absolute;bottom:-24px;background:var(--c,var(--cream));opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(-112vh) rotate(200deg);opacity:0}}

.panel-in{animation:fadein .45s ease both}
@keyframes fadein{from{opacity:0}}

/* заголовок: после появления слова мягко «дышат» волной */
.w{animation:pop .8s cubic-bezier(.2,1.7,.4,1) both,wave 3.6s ease-in-out infinite;
animation-delay:calc(var(--i)*.1s + .1s),calc(var(--i)*.18s + 1.5s);transition:translate .2s,rotate .2s}
.w:hover{transform:none;translate:0 -10px;rotate:-5deg}
@keyframes wave{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(-1.4deg)}}

/* логотип иногда «глючит» как в пиксельной игре */
.logo{animation:glitch 6s steps(1) infinite}
@keyframes glitch{0%,90%,100%{translate:0 0}92%{translate:-2px 1px}94%{translate:2px -1px}96%{translate:-1px 0}}

/* фото парит, на нём бегает блик за курсором */
.photo{animation:pop .9s cubic-bezier(.2,1.5,.4,1) .7s both,floaty 6s ease-in-out 1.8s infinite}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -10px}}
.photo::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .3s;
background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.32),transparent 45%)}
@media (hover:hover){.photo:hover::after{opacity:1}}

/* кнопки: блик пробегает сам, стрелка кивает */
.cta::after{animation:shine 5s ease-in-out 2.5s infinite}
.cta:hover::after{animation:none}
@keyframes shine{0%{transform:translateX(-120%)}22%,100%{transform:translateX(120%)}}
.cta svg,.dl svg{animation:arrow 1.3s ease-in-out infinite}
@keyframes arrow{0%,100%{translate:0 0}50%{translate:0 4px}}

/* вкладка «Скачать»: заголовок и карточка выезжают по очереди */
.dl-wrap h2{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
.card{animation:pop .8s cubic-bezier(.2,1.5,.4,1) .15s both}

/* след от курсора и всплеск от кликов */
.fx{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.trail{position:absolute;width:9px;height:9px;box-shadow:0 0 0 2px var(--ink);animation:trail .75s linear forwards}
@keyframes trail{to{transform:translate(var(--tx,0),28px) scale(.2) rotate(90deg);opacity:0}}
.burst{position:absolute;width:9px;height:9px;box-shadow:0 0 0 2px var(--ink);animation:burst .65s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(180deg) scale(.2);opacity:0}}

@media (max-width:820px){.sparks i:nth-child(n+11){display:none}}
</style>
</head>

<div class="sparks" aria-hidden="true"></div>

  <a class="logo" href="#home" data-tab="home">claude shimeji<i></i></a>

<script>
(function(){
  var tabs=document.querySelectorAll('[role="tab"]');
  var panels={home:document.getElementById('home'),download:document.getElementById('download')};
  function show(name){
    if(!panels[name]) name='home';
    Object.keys(panels).forEach(function(k){panels[k].hidden=(k!==name)});
    tabs.forEach(function(t){t.setAttribute('aria-selected',String(t.dataset.tab===name))});
    try{history.replaceState(null,'','#'+name)}catch(e){}
    window.scrollTo({top:0,behavior:'smooth'});
  }
  document.querySelectorAll('[data-tab]').forEach(function(el){
    el.addEventListener('click',function(e){e.preventDefault();show(el.dataset.tab)});
  });
  document.getElementById('go-download').addEventListener('click',function(){show('download')});
  show(location.hash==='#download'?'download':'home');

  // на телефоне наведения нет: фото переключается нажатием
  var photo=document.getElementById('photo');
  function toggle(){photo.classList.toggle('show')}
  photo.addEventListener('click',toggle);
  photo.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
})();
</script>
<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce) return;
  var COLORS=['#fff1de','#ffd27a','#ff9a2e','#2b1208'];

  // плавающие пиксельные искорки на фоне
  var sp=document.querySelector('.sparks');
  for(var i=0;i<18;i++){
    var e=document.createElement('i'), sz=5+Math.random()*9;
    e.style.cssText='left:'+(Math.random()*100)+'%;width:'+sz+'px;height:'+sz+'px;--c:'+COLORS[i%3]+
      ';animation-duration:'+(10+Math.random()*14)+'s;animation-delay:-'+(Math.random()*20)+'s';
    sp.appendChild(e);
  }

  // плавный показ вкладки при переключении
  function panelFx(){
    ['home','download'].forEach(function(id){
      var el=document.getElementById(id);
      if(el && !el.hidden){el.classList.remove('panel-in');void el.offsetWidth;el.classList.add('panel-in');}
    });
  }
  document.querySelectorAll('[data-tab],#go-download').forEach(function(el){el.addEventListener('click',panelFx)});

  var fx=document.createElement('div'); fx.className='fx'; document.body.appendChild(fx);

  // блик на фото следует за курсором
  var ph=document.getElementById('photo');
  if(ph) ph.addEventListener('mousemove',function(e){
    var r=ph.getBoundingClientRect();
    ph.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');
    ph.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%');
  });

  // пиксельный след за курсором (только на компьютере)
  if(matchMedia('(hover:hover)').matches){
    var last=0;
    window.addEventListener('mousemove',function(e){
      var t=performance.now(); if(t-last<38||fx.children.length>45) return; last=t;
      var d=document.createElement('i'); d.className='trail';
      d.style.left=(e.clientX-4)+'px'; d.style.top=(e.clientY-4)+'px';
      d.style.background=COLORS[Math.floor(Math.random()*3)];
      d.style.setProperty('--tx',((Math.random()-.5)*30)+'px');
      d.addEventListener('animationend',function(){d.remove()});
      fx.appendChild(d);
    });
  }

  // всплеск квадратиков при нажатии на кнопки и фото
  document.addEventListener('click',function(e){
    var t=e.target.closest('.cta,.dl,nav button,.photo'); if(!t) return;
    var x=e.clientX,y=e.clientY;
    if(!x&&!y){var r=t.getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height/2;}
    for(var i=0;i<12;i++){
      var b=document.createElement('i'), a=Math.PI*2*i/12+Math.random()*.4, dist=40+Math.random()*50;
      b.className='burst'; b.style.left=(x-4)+'px'; b.style.top=(y-4)+'px';
      b.style.background=COLORS[i%3];
      b.style.setProperty('--dx',Math.cos(a)*dist+'px'); b.style.setProperty('--dy',Math.sin(a)*dist+'px');
      b.addEventListener('animationend',function(){this.remove()});
      fx.appendChild(b);
    }
  });
})();
</script>
